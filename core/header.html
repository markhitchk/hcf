<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harley's Clan Forum Header</title>
<style>
:root{
  --notice-yellow:#ffd400;
  --notice-yellow-light:#fff08a;
  --notice-text:#fff7c2;
  --notice-dark:#090a0c;
  --notice-glow:rgba(255,212,0,.72);
  --notice-glow-soft:rgba(255,212,0,.24);
  --birthday-cyan:#00ffff;
  --birthday-blue:#5ea1ff;
  --birthday-purple:#b86cff;
  --birthday-pink:#ff5fc8;
  --birthday-gold:#ffd76a;
  --hc-banner-height:58px;
}

.hc-header-stack,
.hc-header-stack *,
.hc-header-stack *::before,
.hc-header-stack *::after,
#hc-birthday-page-confetti,
#hc-birthday-page-confetti *{
  box-sizing:border-box;
}

.hc-header-stack{
  position:relative;
  z-index:901;
  isolation:isolate;
  width:100%;
  max-width:100%;
  margin:0;
  padding:0;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
}

.hc-header-stack #forum-notice,
.hc-header-stack #hc-birthday-header,
.hc-header-stack #hc-holiday-header,
.hc-header-stack [data-hc-banner]{
  height:var(--hc-banner-height)!important;
  min-height:var(--hc-banner-height)!important;
  max-height:var(--hc-banner-height)!important;
}

.hc-banner-slide{
  width:100%;
  max-width:100%;
  height:var(--hc-banner-height);
  min-height:var(--hc-banner-height);
  max-height:var(--hc-banner-height);
  margin:0;
  padding:0;
  overflow:hidden;
}

/* A dismissed banner must also collapse its rotator wrapper. */
.hc-banner-slide[hidden]{
  display:none!important;
  width:0!important;
  height:0!important;
  min-height:0!important;
  max-height:0!important;
  margin:0!important;
  padding:0!important;
  border:0!important;
  overflow:hidden!important;
}

.hc-header-stack:empty{
  display:none!important;
  height:0!important;
  min-height:0!important;
  margin:0!important;
  padding:0!important;
}

.hc-header-stack.hc-banner-rotator{
  position:relative;
  height:var(--hc-banner-height)!important;
  min-height:var(--hc-banner-height);
  max-height:var(--hc-banner-height);
  transition:height 1.8s ease;
}

.hc-header-stack.hc-banner-rotator>.hc-banner-slide{
  position:absolute;
  top:0;
  left:0;
  z-index:0;
  width:100%;
  opacity:0;
  pointer-events:none;
  transform:translate3d(100%,0,0);
  transition:transform 1.8s cubic-bezier(.22,.61,.36,1),opacity 1.35s ease;
  will-change:transform,opacity;
}

.hc-header-stack.hc-banner-rotator>.hc-banner-slide.is-active{
  position:relative;
  z-index:2;
  opacity:1;
  pointer-events:auto;
  transform:translate3d(0,0,0);
}

.hc-header-stack.hc-banner-rotator>.hc-banner-slide.is-active.is-leaving{
  position:absolute;
  z-index:1;
  opacity:0;
  pointer-events:none;
  transform:translate3d(-100%,0,0);
}

.hc-header-stack.hc-banner-rotator>.hc-banner-slide.is-entering{
  position:absolute;
  z-index:3;
  opacity:0;
  transform:translate3d(100%,0,0);
}

.hc-header-stack.hc-banner-rotator>.hc-banner-slide.is-entering.is-entering-active{
  opacity:1;
  pointer-events:auto;
  transform:translate3d(0,0,0);
}

#hc-birthday-header[hidden]{display:none!important}

#hc-birthday-header{
  position:relative;
  isolation:isolate;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  width:100%;
  min-height:54px;
  margin:0;
  padding:8px 48px 8px 16px;
  overflow:hidden;
  border-top:1px solid rgba(255,255,255,.72);
  border-bottom:1px solid rgba(255,255,255,.72);
  background:linear-gradient(115deg,rgba(0,210,220,.98),rgba(79,140,255,.98),rgba(184,108,255,.98),rgba(255,95,200,.98));
  color:#fff;
  text-align:center;
  box-shadow:0 7px 22px rgba(0,0,0,.32),0 0 20px rgba(0,255,255,.24),inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(255,255,255,.12);
  animation:hcBirthdayHeaderEnter .65s cubic-bezier(.2,.8,.2,1) both,hcBirthdayHeaderGlow 3s ease-in-out .65s infinite;
}

#hc-birthday-header::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-2;
  pointer-events:none;
  background:radial-gradient(circle at 15% 40%,rgba(255,255,255,.20),transparent 22%),radial-gradient(circle at 82% 50%,rgba(255,215,106,.18),transparent 26%);
}

#hc-birthday-header::after{
  content:"";
  position:absolute;
  top:-45%;
  left:-40%;
  z-index:-1;
  width:34%;
  height:190%;
  pointer-events:none;
  opacity:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),rgba(255,255,255,.42),rgba(255,255,255,.08),transparent);
  transform:skewX(-18deg);
  animation:hcBirthdayHeaderSweep 4.8s ease-in-out infinite;
}

.hc-birthday-cake{
  position:relative;
  z-index:3;
  display:inline-block;
  flex:0 0 auto;
  font-size:27px;
  line-height:1;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.3));
  animation:hcBirthdayCake 1.55s ease-in-out infinite;
}

.hc-birthday-copy{
  position:relative;
  z-index:3;
  min-width:0;
}

.hc-birthday-copy strong{
  display:block;
  color:#fff;
  font-size:15px;
  font-weight:900;
  line-height:1.2;
  letter-spacing:.055em;
  text-shadow:0 1px 2px rgba(0,0,0,.55),0 0 9px rgba(255,255,255,.3);
}

.hc-birthday-copy small{
  display:block;
  margin-top:3px;
  color:rgba(255,255,255,.94);
  font:700 9px/1.35 "Courier New",monospace;
  letter-spacing:.12em;
  text-transform:uppercase;
  text-shadow:0 1px 2px rgba(0,0,0,.42);
}

#hc-birthday-header-close{
  position:absolute;
  top:50%;
  right:10px;
  z-index:5;
  display:grid;
  place-items:center;
  width:32px;
  height:32px;
  padding:0;
  border:1px solid rgba(255,255,255,.46);
  border-radius:50%;
  background:rgba(0,0,0,.22);
  color:#fff;
  cursor:pointer;
  font:700 20px/1 Arial,sans-serif;
  transform:translateY(-50%);
  transition:background-color .18s ease,transform .18s ease,border-color .18s ease;
}

#hc-birthday-header-close:hover,
#hc-birthday-header-close:focus-visible{
  border-color:#fff;
  background:rgba(0,0,0,.44);
  outline:none;
  transform:translateY(-50%) scale(1.08);
}

.hc-birthday-header-confetti{
  position:absolute;
  inset:0;
  z-index:1;
  overflow:hidden;
  pointer-events:none;
}

.hc-birthday-header-confetti i{
  position:absolute;
  top:-16px;
  left:var(--x);
  display:block;
  width:var(--size);
  height:calc(var(--size) * 1.7);
  border-radius:2px;
  background:var(--color);
  opacity:.82;
  transform:rotate(var(--rotate));
  animation:hcBirthdayHeaderConfettiFall var(--duration) linear infinite;
  animation-delay:var(--delay);
}

#hc-birthday-page-confetti{
  position:fixed;
  inset:0;
  z-index:800;
  overflow:hidden;
  pointer-events:none;
  contain:strict;
}

#hc-birthday-page-confetti i{
  position:absolute;
  top:-36px;
  left:var(--x);
  display:block;
  width:var(--size);
  height:calc(var(--size) * 1.75);
  border-radius:2px;
  background:var(--color);
  opacity:var(--opacity);
  filter:drop-shadow(0 0 2px rgba(255,255,255,.16));
  transform:rotate(var(--rotate));
  animation:hcBirthdayPageConfettiFall var(--duration) linear infinite;
  animation-delay:var(--delay);
}

@keyframes hcBirthdayHeaderEnter{
  from{opacity:0;transform:translateY(-100%) scaleY(.72);filter:blur(3px)}
  to{opacity:1;transform:translateY(0) scaleY(1);filter:blur(0)}
}

@keyframes hcBirthdayHeaderGlow{
  0%,100%{box-shadow:0 7px 22px rgba(0,0,0,.32),0 0 18px rgba(0,255,255,.22),inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(255,255,255,.12)}
  50%{box-shadow:0 8px 25px rgba(0,0,0,.35),0 0 28px rgba(0,255,255,.4),0 0 38px rgba(255,95,200,.22),inset 0 1px 0 rgba(255,255,255,.24),inset 0 -1px 0 rgba(255,255,255,.18)}
}

@keyframes hcBirthdayHeaderSweep{
  0%,12%{left:-40%;opacity:0}
  20%{opacity:.95}
  68%{opacity:.55}
  80%,100%{left:115%;opacity:0}
}

@keyframes hcBirthdayCake{
  0%,100%{transform:translateY(1px) rotate(-5deg) scale(.97)}
  50%{transform:translateY(-3px) rotate(5deg) scale(1.06)}
}

@keyframes hcBirthdayHeaderConfettiFall{
  0%{transform:translate3d(0,-18px,0) rotate(var(--rotate))}
  100%{transform:translate3d(var(--drift),78px,0) rotate(calc(var(--rotate) + 430deg))}
}

@keyframes hcBirthdayPageConfettiFall{
  0%{transform:translate3d(0,-8vh,0) rotate(var(--rotate))}
  45%{transform:translate3d(var(--drift),48vh,0) rotate(calc(var(--rotate) + 360deg))}
  100%{transform:translate3d(var(--drift-end),112vh,0) rotate(calc(var(--rotate) + 780deg))}
}

#forum-notice{
  position:relative;
  isolation:isolate;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  width:100%;
  min-height:46px;
  padding:6px 44px 7px;
  overflow:hidden;
  border-top:1px solid var(--notice-yellow);
  border-bottom:1px solid var(--notice-yellow);
  background:linear-gradient(180deg,rgba(255,212,0,.035),transparent 48%),var(--notice-dark);
  color:var(--notice-yellow);
  text-align:center;
  box-shadow:0 0 16px rgba(255,212,0,.08),inset 0 1px 0 rgba(255,255,255,.035),inset 0 -1px 0 rgba(255,212,0,.06);
  animation:noticeEnter .72s cubic-bezier(.2,.8,.2,1) both,noticeBorderPulse 3.4s ease-in-out .72s infinite;
}

#forum-notice::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  pointer-events:none;
  opacity:.22;
  background:repeating-linear-gradient(-45deg,transparent 0 10px,rgba(255,212,0,.5) 10px 20px);
  background-size:28px 28px;
  animation:noticeStripes 2.8s linear infinite;
}

#forum-notice::after{
  content:"";
  position:absolute;
  top:-35%;
  left:-45%;
  z-index:0;
  width:38%;
  height:170%;
  pointer-events:none;
  opacity:0;
  background:linear-gradient(90deg,transparent,rgba(255,212,0,.07),rgba(255,245,180,.42),rgba(255,212,0,.07),transparent);
  transform:skewX(-18deg);
  animation:noticeSweep 5.2s ease-in-out infinite;
}

.notice-title,
.notice-message{position:relative;z-index:2}

.notice-title{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  font-size:13px;
  font-weight:800;
  line-height:1.2;
  letter-spacing:2px;
  text-transform:uppercase;
  text-shadow:0 0 5px var(--notice-glow);
  animation:noticeTitleSignal 4.6s ease-in-out infinite;
}

.notice-beacon{
  display:inline-block;
  flex:0 0 auto;
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--notice-yellow);
  box-shadow:0 0 5px var(--notice-yellow),0 0 12px var(--notice-glow);
  animation:noticeBeacon 1.65s ease-in-out infinite;
}

.notice-beacon:last-child{animation-delay:.42s}
.notice-warning-icon,.notice-message-icon{display:inline-block;transform-origin:center}
.notice-warning-icon:first-of-type{animation:noticeWarningLeft 2.4s ease-in-out infinite}
.notice-warning-icon:last-of-type{animation:noticeWarningRight 2.4s ease-in-out infinite}

.notice-message{
  margin-top:3px;
  color:var(--notice-text);
  font-size:11px;
  line-height:1.35;
  animation:noticeMessageFade 5s ease-in-out infinite;
}

.notice-message-icon{margin-right:1px;animation:noticeIconFloat 2.1s ease-in-out infinite}
.notice-message-icon,.notice-message a{margin-left:.35em}
.notice-message-icon:nth-of-type(2){animation-delay:.3s}
.notice-message-icon:nth-of-type(3){animation-delay:.6s}
.notice-message strong{color:#fff2a4;text-shadow:0 0 5px rgba(255,212,0,.18)}

.notice-message a{
  position:relative;
  display:inline-block;
  color:var(--notice-yellow);
  font-weight:800;
  text-decoration:none;
  text-shadow:0 0 5px rgba(255,212,0,.2);
  transition:color .2s ease,text-shadow .2s ease,transform .2s ease;
}

.notice-message a::after{
  content:"";
  position:absolute;
  left:0;
  right:100%;
  bottom:-1px;
  height:1px;
  background:var(--notice-yellow-light);
  box-shadow:0 0 5px var(--notice-glow);
  transition:right .25s ease;
}

.notice-message a:hover{
  color:var(--notice-yellow-light);
  text-shadow:0 0 6px var(--notice-glow),0 0 12px var(--notice-glow-soft);
  transform:translateY(-1px);
}

.notice-message a:hover::after{right:0}
.notice-message a:focus-visible{border-radius:2px;outline:2px solid var(--notice-yellow);outline-offset:3px}

@keyframes noticeEnter{
  from{opacity:0;transform:translateY(-100%) scaleY(.7);filter:blur(3px)}
  to{opacity:1;transform:translateY(0) scaleY(1);filter:blur(0)}
}

@keyframes noticeBorderPulse{
  0%,100%{border-color:rgba(255,212,0,.55);box-shadow:0 0 10px rgba(255,212,0,.05),inset 0 1px 0 rgba(255,255,255,.025),inset 0 -1px 0 rgba(255,212,0,.04)}
  50%{border-color:var(--notice-yellow);box-shadow:0 0 20px rgba(255,212,0,.16),inset 0 1px 0 rgba(255,255,255,.055),inset 0 -1px 0 rgba(255,212,0,.12)}
}

@keyframes noticeStripes{from{background-position:0 0}to{background-position:28px 28px}}
@keyframes noticeSweep{0%,12%{left:-45%;opacity:0}20%{opacity:.9}66%{opacity:.65}78%,100%{left:115%;opacity:0}}
@keyframes noticeTitleSignal{0%,86%,100%{opacity:1;letter-spacing:2px;text-shadow:0 0 5px var(--notice-glow)}89%{opacity:.58;text-shadow:none}92%{opacity:1;letter-spacing:2.4px;text-shadow:0 0 7px var(--notice-yellow),0 0 15px var(--notice-glow)}95%{opacity:.76}}
@keyframes noticeBeacon{0%,100%{opacity:.35;transform:scale(.72);box-shadow:0 0 4px var(--notice-yellow)}50%{opacity:1;transform:scale(1.25);box-shadow:0 0 6px var(--notice-yellow),0 0 15px var(--notice-glow)}}
@keyframes noticeWarningLeft{0%,100%{transform:rotate(-4deg) scale(.96)}50%{transform:rotate(4deg) scale(1.08)}}
@keyframes noticeWarningRight{0%,100%{transform:rotate(4deg) scale(.96)}50%{transform:rotate(-4deg) scale(1.08)}}
@keyframes noticeIconFloat{0%,100%{transform:translateY(1px) scale(.96)}50%{transform:translateY(-2px) scale(1.07)}}
@keyframes noticeMessageFade{0%,100%{opacity:.82}50%{opacity:1}}

@media(max-width:600px){
  :root{--hc-banner-height:64px}
  #hc-birthday-header{min-height:52px;gap:8px;padding:7px 40px 7px 9px}
  .hc-birthday-cake{font-size:22px}
  .hc-birthday-copy strong{font-size:12px;letter-spacing:.025em}
  .hc-birthday-copy small{font-size:8px;letter-spacing:.07em}
  #hc-birthday-header-close{right:6px;width:29px;height:29px;font-size:17px}
  #forum-notice{min-height:50px;padding:7px 10px 8px}
  .notice-title{gap:5px;font-size:11px;letter-spacing:1.25px}
  .notice-message{max-width:100%;font-size:10px;line-height:1.45}
  .notice-beacon{width:5px;height:5px}
}

@media(prefers-reduced-motion:reduce){
  .hc-header-stack.hc-banner-rotator,
  .hc-header-stack.hc-banner-rotator>.hc-banner-slide{transition:none!important}
  #hc-birthday-header,
  #hc-birthday-header::before,
  #hc-birthday-header::after,
  .hc-birthday-cake,
  .hc-birthday-header-confetti i,
  #hc-birthday-page-confetti i,
  #forum-notice,
  #forum-notice::before,
  #forum-notice::after,
  .notice-title,
  .notice-beacon,
  .notice-warning-icon,
  .notice-message,
  .notice-message-icon{animation:none!important}
  #hc-birthday-page-confetti{display:none!important}
  .notice-message a,#hc-birthday-header-close{transition:none}
  .notice-message a:hover,#hc-birthday-header-close:hover{transform:none}
}
</style>
</head>
<body>
<div class="hc-header-stack" id="hc-header-stack" data-hc-celebrations="sequential-v2">
  <div id="forum-notice" role="status" aria-label="Harley's Clan Forum notice">
    <div class="notice-title">
      <span class="notice-beacon" aria-hidden="true"></span>
      <span class="notice-warning-icon" aria-hidden="true">⚠</span>
      <span>Harley's Clan Forum Notice</span>
      <span class="notice-warning-icon" aria-hidden="true">⚠</span>
      <span class="notice-beacon" aria-hidden="true"></span>
    </div>
    <div class="notice-message">
      <span class="notice-message-icon" aria-hidden="true">🚧</span>
      Under Construction
      <span aria-hidden="true">•</span>
      <span class="notice-message-icon" aria-hidden="true">💬</span>
      DM issues? Open:
      <a href="https://forum.harleytg.com/conversations">Direct Messages</a>
      <span aria-hidden="true">•</span>
      <span class="notice-message-icon" aria-hidden="true">🌐</span>
      Domain Expiration:
      <strong>October 12, 2026</strong>
      <a href="https://forum.harleytg.com/d/77-domain-expiration-alert">Info</a>
    </div>
  </div>

  <section id="hc-birthday-header" role="status" aria-live="polite" aria-label="Member birthday celebration" hidden>
    <span class="hc-birthday-cake" aria-hidden="true">🎂</span>
    <div class="hc-birthday-copy">
      <strong id="hc-birthday-title">Happy Birthday! 🎉</strong>
      <small id="hc-birthday-date">Harley’s Clan Birthday Celebration</small>
    </div>
    <button id="hc-birthday-header-close" type="button" aria-label="Close birthday announcement">×</button>
    <span class="hc-birthday-header-confetti" id="hc-birthday-header-confetti" aria-hidden="true"></span>
  </section>
</div>

<script>
(function(){
  "use strict";

  var BIRTHDAY_RECORDS_URL="https://cdn.jsdelivr.net/gh/markhitchk/hcf@main/addons/celebrations/birthdays.json?v=20260804";
  var PACIFIC_TIME_ZONE="America/Los_Angeles";
  var CHECK_INTERVAL=30000;
  var PAGE_CONFETTI_ID="hc-birthday-page-confetti";
  var MONTH_NAMES=["January","February","March","April","May","June","July","August","September","October","November","December"];
  var FALLBACK_RECORDS=[
    {displayName:"Comander Forrest",month:1,day:28},
    {displayName:"Woodyseal1213",month:2,day:4},
    {displayName:"Zack (Big King Sexy)",month:3,day:19},
    {displayName:"Darsoul",month:4,day:7},
    {displayName:"Levi-jeans",month:6,day:7},
    {displayName:"HarleyTG",month:8,day:4},
    {displayName:"Gh0st",month:9,day:1},
    {displayName:"R3V0L",month:11,day:11},
    {displayName:"SMOKES1722",month:11,day:28},
    {displayName:"KING OF HEARTS",month:12,day:8},
    {displayName:"xeqtmツ",month:12,day:28}
  ];

  var birthdayRecords=FALLBACK_RECORDS.slice();
  var banner=document.getElementById("hc-birthday-header");
  var birthdayTitle=document.getElementById("hc-birthday-title");
  var birthdayDate=document.getElementById("hc-birthday-date");
  var closeButton=document.getElementById("hc-birthday-header-close");
  var headerConfetti=document.getElementById("hc-birthday-header-confetti");
  var colors=["#00ffff","#5ea1ff","#b86cff","#ff5fc8","#ffd76a","#ffffff"];

  function queryValue(name){
    try{return new URLSearchParams(location.search).get(name)||""}
    catch(error){return ""}
  }

  function isCelebrationTest(){
    var mode=queryValue("hcHoliday").toLowerCase();
    return mode==="all"||mode==="test"||mode==="test-all";
  }

  function syncBannerSlot(element){
    if(!element){return}
    var slot=element.closest(".hc-banner-slide");
    if(slot){slot.hidden=Boolean(element.hidden)}
  }

  function setBannerHidden(hidden){
    if(!banner){return}
    banner.hidden=Boolean(hidden);
    syncBannerSlot(banner);
    window.setTimeout(function(){syncBannerSlot(banner)},0);
  }

  function padNumber(value){return value<10?"0"+value:String(value)}

  function getPacificDate(){
    var parts=new Intl.DateTimeFormat("en-US",{
      timeZone:PACIFIC_TIME_ZONE,
      year:"numeric",
      month:"numeric",
      day:"numeric"
    }).formatToParts(new Date());
    var date={year:0,month:0,day:0};
    for(var index=0;index<parts.length;index++){
      if(parts[index].type==="year"){date.year=Number(parts[index].value)}
      if(parts[index].type==="month"){date.month=Number(parts[index].value)}
      if(parts[index].type==="day"){date.day=Number(parts[index].value)}
    }
    date.iso=date.year+"-"+padNumber(date.month)+"-"+padNumber(date.day);
    return date;
  }

  function validRecord(record){
    return record&&typeof record.displayName==="string"&&record.displayName.trim()!==""&&
      Number.isInteger(Number(record.month))&&Number(record.month)>=1&&Number(record.month)<=12&&
      Number.isInteger(Number(record.day))&&Number(record.day)>=1&&Number(record.day)<=31;
  }

  function sanitizeRecords(records){
    if(!Array.isArray(records)){return FALLBACK_RECORDS.slice()}
    return records.filter(validRecord).map(function(record){
      return {displayName:record.displayName.trim(),month:Number(record.month),day:Number(record.day)};
    });
  }

  function birthdaysForDate(date){
    return birthdayRecords.filter(function(record){
      return record.month===date.month&&record.day===date.day;
    });
  }

  function formatNames(records){
    var names=records.map(function(record){return record.displayName});
    if(names.length===1){return names[0]}
    if(names.length===2){return names[0]+" & "+names[1]}
    return names.slice(0,-1).join(", ")+" & "+names[names.length-1];
  }

  function safeStorageGet(key){
    try{return sessionStorage.getItem(key)}catch(error){return null}
  }

  function safeStorageSet(key,value){
    try{sessionStorage.setItem(key,value)}catch(error){}
  }

  function createPiece(container,pageMode){
    var piece=document.createElement("i");
    var size=(pageMode?5:3)+Math.random()*(pageMode?7:5);
    var drift=(pageMode?-95:-18)+Math.random()*(pageMode?190:36);
    piece.style.setProperty("--x",Math.random()*100+"%");
    piece.style.setProperty("--size",size+"px");
    piece.style.setProperty("--color",colors[Math.floor(Math.random()*colors.length)]);
    piece.style.setProperty("--rotate",Math.random()*360+"deg");
    piece.style.setProperty("--duration",(pageMode?7:2.8)+Math.random()*(pageMode?8:3.2)+"s");
    piece.style.setProperty("--delay",-Math.random()*(pageMode?14:5)+"s");
    piece.style.setProperty("--drift",drift+"px");
    if(pageMode){
      piece.style.setProperty("--drift-end",(-drift*.45)+"px");
      piece.style.setProperty("--opacity",(.48+Math.random()*.42).toFixed(2));
    }
    container.appendChild(piece);
  }

  function buildHeaderConfetti(){
    if(!headerConfetti||headerConfetti.children.length){return}
    for(var index=0;index<26;index++){createPiece(headerConfetti,false)}
  }

  function buildPageConfetti(){
    var layer=document.getElementById(PAGE_CONFETTI_ID);
    if(!layer){
      layer=document.createElement("div");
      layer.id=PAGE_CONFETTI_ID;
      layer.setAttribute("aria-hidden","true");
      document.body.appendChild(layer);
    }
    if(layer.children.length){return}
    var amount=window.innerWidth<=600?34:58;
    for(var index=0;index<amount;index++){createPiece(layer,true)}
  }

  function removePageConfetti(){
    var layer=document.getElementById(PAGE_CONFETTI_ID);
    if(layer){layer.remove()}
  }

  function removeLegacyBirthdayUi(){
    ["hc-birthday-banner","hc-birthday-effects","hc-birthday-style"].forEach(function(id){
      var element=document.getElementById(id);
      if(element){element.remove()}
    });
  }

  function updateBirthdayMode(){
    removeLegacyBirthdayUi();
    if(!banner){return}

    /* The all-celebrations tester supplies its own birthday test banner.
       Keep the normal birthday banner and confetti out of that sequence. */
    if(isCelebrationTest()){
      setBannerHidden(true);
      document.body.classList.remove("hc-birthday-active");
      removePageConfetti();
      return;
    }

    var date=getPacificDate();
    var todaysBirthdays=birthdaysForDate(date);
    if(!todaysBirthdays.length){
      setBannerHidden(true);
      document.body.classList.remove("hc-birthday-active");
      removePageConfetti();
      return;
    }

    var names=formatNames(todaysBirthdays);
    var dismissKey="hc-birthday-header-dismissed-"+date.iso;
    birthdayTitle.textContent="Happy Birthday, "+names+"! 🎉";
    birthdayDate.textContent=MONTH_NAMES[date.month-1]+" "+date.day+" • Harley’s Clan Birthday Celebration";
    banner.setAttribute("aria-label","Birthday celebration for "+names);
    document.body.classList.add("hc-birthday-active");
    buildHeaderConfetti();
    buildPageConfetti();
    setBannerHidden(safeStorageGet(dismissKey)==="yes");
  }

  function loadBirthdayRecords(){
    if(typeof fetch!=="function"){
      updateBirthdayMode();
      return;
    }
    fetch(BIRTHDAY_RECORDS_URL,{cache:"no-store"})
      .then(function(response){
        if(!response.ok){throw new Error("Birthday records request failed")}
        return response.json();
      })
      .then(function(data){
        birthdayRecords=sanitizeRecords(data&&data.records);
        updateBirthdayMode();
      })
      .catch(function(){
        birthdayRecords=FALLBACK_RECORDS.slice();
        updateBirthdayMode();
      });
  }

  if(closeButton){
    closeButton.addEventListener("click",function(){
      var date=getPacificDate();
      safeStorageSet("hc-birthday-header-dismissed-"+date.iso,"yes");
      setBannerHidden(true);
      removePageConfetti();
    });
  }

  updateBirthdayMode();
  loadBirthdayRecords();
  window.setInterval(updateBirthdayMode,CHECK_INTERVAL);
})();
</script>

<!--
  Celebration test mode is now loaded directly by header.html.
  Test all banners and one matching particle set at a time:
  https://forum.harleytg.com/?hcHoliday=all
-->
<script src="https://cdn.jsdelivr.net/gh/markhitchk/hcf@686d71cee187173688aa22ec5a3b798e75c9c7c2/addons/celebrations/holidays.js"></script>

<script>
(function(){
  "use strict";

  var stack=document.getElementById("hc-header-stack");
  if(!stack){return}

  var ROTATE_EVERY=12000;
  var TRANSITION_TIME=1800;
  var timer=null;
  var currentSlide=null;
  var transitioning=false;
  var paused=false;
  var syncQueued=false;
  var bannerSelector="#forum-notice,#hc-birthday-header,#hc-holiday-header,[data-hc-banner]";
  var reduceMotion=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function bannerForSlide(slide){
    return slide&&slide.querySelector(bannerSelector);
  }

  function isVisibleBanner(banner){
    return Boolean(banner&&!banner.hidden&&window.getComputedStyle(banner).display!=="none");
  }

  function syncSlideHiddenState(slide){
    var banner=bannerForSlide(slide);
    if(!banner){
      slide.hidden=true;
      return;
    }
    slide.hidden=!isVisibleBanner(banner);
  }

  function wrapBanners(){
    var children=Array.prototype.slice.call(stack.children);
    children.forEach(function(child){
      if(child.classList&&child.classList.contains("hc-banner-slide")){
        syncSlideHiddenState(child);
        return;
      }
      if(!child.matches||!child.matches(bannerSelector)){return}
      var wrapper=document.createElement("div");
      wrapper.className="hc-banner-slide";
      wrapper.setAttribute("data-hc-banner-slide","");
      stack.insertBefore(wrapper,child);
      wrapper.appendChild(child);
      syncSlideHiddenState(wrapper);
    });
  }

  function allSlides(){
    return Array.prototype.slice.call(stack.querySelectorAll(":scope > .hc-banner-slide"));
  }

  function visibleSlides(){
    return allSlides().filter(function(slide){
      syncSlideHiddenState(slide);
      return !slide.hidden&&isVisibleBanner(bannerForSlide(slide));
    });
  }

  function clearClasses(slide){
    slide.classList.remove("is-active","is-leaving","is-entering","is-entering-active");
    slide.removeAttribute("aria-hidden");
  }

  function setSingleMode(slides){
    window.clearInterval(timer);
    timer=null;
    transitioning=false;
    stack.classList.remove("hc-banner-rotator");
    stack.style.height="";
    allSlides().forEach(clearClasses);
    currentSlide=slides.length?slides[0]:null;
  }

  function activate(slide,slides){
    slides.forEach(function(item){
      clearClasses(item);
      if(item!==slide){item.setAttribute("aria-hidden","true")}
    });
    slide.classList.add("is-active");
    slide.removeAttribute("aria-hidden");
    currentSlide=slide;
    stack.classList.add("hc-banner-rotator");
    stack.style.height="";
  }

  function restartTimer(){
    window.clearInterval(timer);
    timer=null;
    if(paused||visibleSlides().length<2){return}
    timer=window.setInterval(showNext,ROTATE_EVERY);
  }

  function showNext(){
    if(paused||transitioning){return}
    var slides=visibleSlides();
    if(slides.length<2){sync();return}
    var currentIndex=slides.indexOf(currentSlide);
    if(currentIndex<0){
      activate(slides[0],slides);
      restartTimer();
      return;
    }
    var next=slides[(currentIndex+1)%slides.length];
    if(next===currentSlide){return}
    if(reduceMotion){activate(next,slides);return}

    transitioning=true;
    var current=currentSlide;
    var currentHeight=current.offsetHeight;
    next.classList.add("is-entering");
    next.removeAttribute("aria-hidden");
    stack.style.height=currentHeight+"px";
    void next.offsetWidth;
    stack.style.height=next.offsetHeight+"px";
    current.classList.add("is-leaving");
    next.classList.add("is-entering-active");

    window.setTimeout(function(){
      clearClasses(current);
      if(!current.hidden){current.setAttribute("aria-hidden","true")}
      clearClasses(next);
      next.classList.add("is-active");
      next.removeAttribute("aria-hidden");
      currentSlide=next;
      stack.style.height="";
      transitioning=false;
    },TRANSITION_TIME+60);
  }

  function sync(){
    wrapBanners();
    var slides=visibleSlides();
    if(slides.length<2){
      setSingleMode(slides);
      return;
    }
    stack.classList.add("hc-banner-rotator");
    if(!currentSlide||slides.indexOf(currentSlide)===-1){activate(slides[0],slides)}
    restartTimer();
  }

  function queueSync(){
    if(syncQueued){return}
    syncQueued=true;
    window.setTimeout(function(){
      syncQueued=false;
      sync();
    },0);
  }

  stack.addEventListener("mouseenter",function(){
    paused=true;
    window.clearInterval(timer);
    timer=null;
  });

  stack.addEventListener("mouseleave",function(){
    paused=false;
    restartTimer();
  });

  stack.addEventListener("focusin",function(){
    paused=true;
    window.clearInterval(timer);
    timer=null;
  });

  stack.addEventListener("focusout",function(event){
    if(stack.contains(event.relatedTarget)){return}
    paused=false;
    restartTimer();
  });

  document.addEventListener("visibilitychange",function(){
    paused=document.hidden;
    if(paused){
      window.clearInterval(timer);
      timer=null;
    }else{
      restartTimer();
    }
  });

  var observer=new MutationObserver(queueSync);
  observer.observe(stack,{
    childList:true,
    subtree:true,
    attributes:true,
    attributeFilter:["hidden"]
  });

  window.addEventListener("resize",function(){
    if(currentSlide&&stack.classList.contains("hc-banner-rotator")){
      stack.style.height=currentSlide.offsetHeight+"px";
      window.setTimeout(function(){stack.style.height=""},TRANSITION_TIME);
    }
  });

  sync();
})();
</script>
