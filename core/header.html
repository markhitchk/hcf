<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harley's Clan Forum Header</title>
<style>
:root{
  --notice-yellow:#ffd400;
  --notice-yellow-light:#fff08a;
  --notice-text:#fff7c2;
  --notice-dark:#090a0c;
  --notice-glow:rgba(255,212,0,.72);
  --hc-banner-height:58px;
}

.hc-header-stack,
.hc-header-stack *,
.hc-header-stack *::before,
.hc-header-stack *::after,
#hc-birthday-page-confetti,
#hc-birthday-page-confetti *{box-sizing:border-box}

.hc-header-stack{
  position:relative;
  z-index:901;
  isolation:isolate;
  width:100%;
  max-width:100%;
  height:var(--hc-banner-height);
  min-height:var(--hc-banner-height);
  max-height:var(--hc-banner-height);
  margin:0;
  padding:0;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
}

.hc-header-stack[hidden],
.hc-header-stack:empty{
  display:none!important;
  height:0!important;
  min-height:0!important;
  max-height:0!important;
  margin:0!important;
  padding:0!important;
}

.hc-header-stack #forum-notice,
.hc-header-stack #hc-birthday-header,
.hc-header-stack #hc-holiday-header,
.hc-header-stack [data-hc-banner]{
  height:var(--hc-banner-height)!important;
  min-height:var(--hc-banner-height)!important;
  max-height:var(--hc-banner-height)!important;
}

.hc-banner-slide{
  width:100%;
  max-width:100%;
  height:var(--hc-banner-height);
  min-height:var(--hc-banner-height);
  max-height:var(--hc-banner-height);
  margin:0;
  padding:0;
  overflow:hidden;
}

.hc-banner-slide[hidden]{
  display:none!important;
  width:0!important;
  height:0!important;
  min-height:0!important;
  max-height:0!important;
  margin:0!important;
  padding:0!important;
  border:0!important;
  overflow:hidden!important;
}

.hc-header-stack.hc-banner-rotator{
  position:relative;
  height:var(--hc-banner-height)!important;
  min-height:var(--hc-banner-height);
  max-height:var(--hc-banner-height);
}

.hc-header-stack.hc-banner-rotator>.hc-banner-slide{
  position:absolute;
  top:0;
  left:0;
  z-index:0;
  width:100%;
  opacity:0;
  pointer-events:none;
  transform:translate3d(100%,0,0);
  transition:transform .75s cubic-bezier(.22,.61,.36,1),opacity .55s ease;
  will-change:transform,opacity;
}

.hc-header-stack.hc-banner-rotator>.hc-banner-slide.is-active{
  position:relative;
  z-index:2;
  opacity:1;
  pointer-events:auto;
  transform:translate3d(0,0,0);
}

.hc-header-stack.hc-banner-rotator>.hc-banner-slide.is-active.is-leaving{
  position:absolute;
  z-index:1;
  opacity:0;
  pointer-events:none;
  transform:translate3d(-100%,0,0);
}

.hc-header-stack.hc-banner-rotator>.hc-banner-slide.is-entering{
  position:absolute;
  z-index:3;
  opacity:0;
  transform:translate3d(100%,0,0);
}

.hc-header-stack.hc-banner-rotator>.hc-banner-slide.is-entering.is-entering-active{
  opacity:1;
  pointer-events:auto;
  transform:translate3d(0,0,0);
}

#forum-notice{
  position:relative;
  isolation:isolate;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  width:100%;
  margin:0;
  padding:6px 44px 7px;
  overflow:hidden;
  border-top:1px solid var(--notice-yellow);
  border-bottom:1px solid var(--notice-yellow);
  background:linear-gradient(180deg,rgba(255,212,0,.035),transparent 48%),var(--notice-dark);
  color:var(--notice-yellow);
  text-align:center;
  box-shadow:0 0 16px rgba(255,212,0,.08),inset 0 1px rgba(255,255,255,.035);
  animation:noticePulse 3.4s ease-in-out infinite;
}

#forum-notice::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  pointer-events:none;
  opacity:.22;
  background:repeating-linear-gradient(-45deg,transparent 0 10px,rgba(255,212,0,.5) 10px 20px);
  background-size:28px 28px;
  animation:noticeStripes 2.8s linear infinite;
}

.notice-title,.notice-message{position:relative;z-index:2}
.notice-title{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  font-size:13px;
  font-weight:800;
  line-height:1.2;
  letter-spacing:2px;
  text-transform:uppercase;
  text-shadow:0 0 5px var(--notice-glow);
}
.notice-beacon{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--notice-yellow);
  box-shadow:0 0 5px var(--notice-yellow),0 0 12px var(--notice-glow);
  animation:noticeBeacon 1.65s ease-in-out infinite;
}
.notice-message{
  margin-top:3px;
  color:var(--notice-text);
  font-size:11px;
  line-height:1.35;
}
.notice-message a{
  margin-left:.35em;
  color:var(--notice-yellow);
  font-weight:800;
  text-decoration:none;
}
.notice-message a:hover{color:var(--notice-yellow-light)}
.notice-message strong{color:#fff2a4}

#hc-birthday-header[hidden]{display:none!important}
#hc-birthday-header{
  position:relative;
  isolation:isolate;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  width:100%;
  margin:0;
  padding:8px 48px 8px 16px;
  overflow:hidden;
  border-top:1px solid rgba(255,255,255,.72);
  border-bottom:1px solid rgba(255,255,255,.72);
  background:linear-gradient(115deg,rgba(0,210,220,.98),rgba(79,140,255,.98),rgba(184,108,255,.98),rgba(255,95,200,.98));
  color:#fff;
  text-align:center;
  box-shadow:0 7px 22px rgba(0,0,0,.32),0 0 20px rgba(0,255,255,.24),inset 0 1px rgba(255,255,255,.18);
  animation:hcBirthdayGlow 3s ease-in-out infinite;
}
#hc-birthday-header::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-2;
  pointer-events:none;
  background:radial-gradient(circle at 15% 40%,rgba(255,255,255,.2),transparent 22%),radial-gradient(circle at 82% 50%,rgba(255,215,106,.18),transparent 26%);
}
#hc-birthday-header::after{
  content:"";
  position:absolute;
  top:-45%;
  left:-40%;
  z-index:-1;
  width:34%;
  height:190%;
  pointer-events:none;
  opacity:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),rgba(255,255,255,.42),rgba(255,255,255,.08),transparent);
  transform:skewX(-18deg);
  animation:hcBirthdaySweep 4.8s ease-in-out infinite;
}
.hc-birthday-cake{
  position:relative;
  z-index:3;
  flex:0 0 auto;
  font-size:27px;
  line-height:1;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.3));
  animation:hcBirthdayCake 1.55s ease-in-out infinite;
}
.hc-birthday-copy{position:relative;z-index:3;min-width:0}
.hc-birthday-copy strong{
  display:block;
  color:#fff;
  font-size:15px;
  font-weight:900;
  line-height:1.2;
  letter-spacing:.055em;
  text-shadow:0 1px 2px rgba(0,0,0,.55),0 0 9px rgba(255,255,255,.3);
}
.hc-birthday-copy small{
  display:block;
  margin-top:3px;
  color:rgba(255,255,255,.94);
  font:700 9px/1.35 "Courier New",monospace;
  letter-spacing:.12em;
  text-transform:uppercase;
  text-shadow:0 1px 2px rgba(0,0,0,.42);
}
#hc-birthday-header-close{
  position:absolute;
  top:50%;
  right:10px;
  z-index:5;
  display:grid;
  place-items:center;
  width:32px;
  height:32px;
  padding:0;
  border:1px solid rgba(255,255,255,.46);
  border-radius:50%;
  background:rgba(0,0,0,.22);
  color:#fff;
  cursor:pointer;
  font:700 20px/1 Arial,sans-serif;
  transform:translateY(-50%);
  transition:background-color .18s ease,transform .18s ease,border-color .18s ease;
}
#hc-birthday-header-close:hover,
#hc-birthday-header-close:focus-visible{
  border-color:#fff;
  background:rgba(0,0,0,.44);
  outline:none;
  transform:translateY(-50%) scale(1.08);
}
.hc-birthday-header-confetti{
  position:absolute;
  inset:0;
  z-index:1;
  overflow:hidden;
  pointer-events:none;
}
.hc-birthday-header-confetti i,
#hc-birthday-page-confetti i{
  position:absolute;
  top:-30px;
  left:var(--x);
  display:block;
  width:var(--size);
  height:calc(var(--size) * 1.7);
  border-radius:2px;
  background:var(--color);
  opacity:var(--opacity,.82);
  transform:rotate(var(--rotate));
  animation:hcBirthdayFall var(--duration) linear infinite;
  animation-delay:var(--delay);
}
#hc-birthday-page-confetti{
  position:fixed;
  inset:0;
  z-index:800;
  overflow:hidden;
  pointer-events:none;
  contain:strict;
}

/* Keep the external holiday banner horizontal-only. */
html body #hc-holiday-header{
  animation:hcHolidayGlow 3s ease-in-out infinite!important;
}

@keyframes noticePulse{
  50%{border-color:var(--notice-yellow);box-shadow:0 0 20px rgba(255,212,0,.16),inset 0 1px rgba(255,255,255,.055)}
}
@keyframes noticeStripes{to{background-position:28px 28px}}
@keyframes noticeBeacon{
  0%,100%{opacity:.35;transform:scale(.72)}
  50%{opacity:1;transform:scale(1.25)}
}
@keyframes hcBirthdayGlow{
  50%{box-shadow:0 8px 25px rgba(0,0,0,.35),0 0 28px rgba(0,255,255,.4),0 0 38px rgba(255,95,200,.22),inset 0 1px rgba(255,255,255,.24)}
}
@keyframes hcBirthdaySweep{
  0%,12%{left:-40%;opacity:0}
  20%{opacity:.95}
  68%{opacity:.55}
  80%,100%{left:115%;opacity:0}
}
@keyframes hcBirthdayCake{
  0%,100%{transform:translateY(1px) rotate(-5deg) scale(.97)}
  50%{transform:translateY(-3px) rotate(5deg) scale(1.06)}
}
@keyframes hcBirthdayFall{
  from{transform:translate3d(0,-8vh,0) rotate(var(--rotate))}
  to{transform:translate3d(var(--drift),112vh,0) rotate(calc(var(--rotate) + 780deg))}
}

@media(max-width:600px){
  :root{--hc-banner-height:64px}
  #forum-notice{padding:7px 10px 8px}
  .notice-title{gap:5px;font-size:11px;letter-spacing:1.25px}
  .notice-message{font-size:10px;line-height:1.45}
  #hc-birthday-header{gap:8px;padding:7px 40px 7px 9px}
  .hc-birthday-cake{font-size:22px}
  .hc-birthday-copy strong{font-size:12px;letter-spacing:.025em}
  .hc-birthday-copy small{font-size:8px;letter-spacing:.07em}
  #hc-birthday-header-close{right:6px;width:29px;height:29px;font-size:17px}
}

@media(prefers-reduced-motion:reduce){
  .hc-header-stack.hc-banner-rotator,
  .hc-header-stack.hc-banner-rotator>.hc-banner-slide{transition:none!important}
  #forum-notice,
  #forum-notice::before,
  .notice-beacon,
  #hc-birthday-header,
  #hc-birthday-header::after,
  .hc-birthday-cake,
  .hc-birthday-header-confetti i,
  #hc-birthday-page-confetti i{animation:none!important}
  #hc-birthday-page-confetti{display:none!important}
}
</style>
</head>
<body>
<div class="hc-header-stack" id="hc-header-stack">
  <div id="forum-notice" role="status" aria-label="Harley's Clan Forum notice">
    <div class="notice-title">
      <span class="notice-beacon" aria-hidden="true"></span>
      <span aria-hidden="true">⚠</span>
      <span>Harley's Clan Forum Notice</span>
      <span aria-hidden="true">⚠</span>
      <span class="notice-beacon" aria-hidden="true"></span>
    </div>
    <div class="notice-message">
      <span aria-hidden="true">🚧</span> Under Construction
      <span aria-hidden="true"> • 💬 </span>DM issues? Open:
      <a href="https://forum.harleytg.com/conversations">Direct Messages</a>
      <span aria-hidden="true"> • 🌐 </span>Domain Expiration:
      <strong>October 12, 2026</strong>
      <a href="https://forum.harleytg.com/d/77-domain-expiration-alert">Info</a>
    </div>
  </div>

  <section id="hc-birthday-header" role="status" aria-live="polite" aria-label="Member birthday celebration" hidden>
    <span class="hc-birthday-cake" aria-hidden="true">🎂</span>
    <div class="hc-birthday-copy">
      <strong id="hc-birthday-title">Happy Birthday! 🎉</strong>
      <small id="hc-birthday-date">Harley’s Clan Birthday Celebration</small>
    </div>
    <button id="hc-birthday-header-close" type="button" aria-label="Close birthday announcement">×</button>
    <span class="hc-birthday-header-confetti" id="hc-birthday-header-confetti" aria-hidden="true"></span>
  </section>
</div>

<script>
(function(){
  "use strict";

  var RECORDS_URL="https://cdn.jsdelivr.net/gh/markhitchk/hcf@main/addons/celebrations/birthdays.json";
  var TIME_ZONE="America/Los_Angeles";
  var CHECK_INTERVAL=30000;
  var PAGE_ID="hc-birthday-page-confetti";
  var MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
  var fallback=[
    {displayName:"Comander Forrest",month:1,day:28},
    {displayName:"Woodyseal1213",month:2,day:4},
    {displayName:"Zack (Big King Sexy)",month:3,day:19},
    {displayName:"Darsoul",month:4,day:7},
    {displayName:"Levi-jeans",month:6,day:7},
    {displayName:"HarleyTG",month:8,day:4},
    {displayName:"Gh0st",month:9,day:1},
    {displayName:"R3V0L",month:11,day:11},
    {displayName:"SMOKES1722",month:11,day:28},
    {displayName:"KING OF HEARTS",month:12,day:8},
    {displayName:"xeqtmツ",month:12,day:28}
  ];

  var records=fallback.slice();
  var banner=document.getElementById("hc-birthday-header");
  var title=document.getElementById("hc-birthday-title");
  var dateLabel=document.getElementById("hc-birthday-date");
  var close=document.getElementById("hc-birthday-header-close");
  var headerPieces=document.getElementById("hc-birthday-header-confetti");
  var colors=["#00ffff","#5ea1ff","#b86cff","#ff5fc8","#ffd76a","#ffffff"];

  if(!banner||!title||!dateLabel||!close||!headerPieces){return}

  function pad(value){return value<10?"0"+value:String(value)}
  function dateNow(){
    var parts=new Intl.DateTimeFormat("en-US",{
      timeZone:TIME_ZONE,
      year:"numeric",
      month:"numeric",
      day:"numeric"
    }).formatToParts(new Date());
    var date={year:0,month:0,day:0};
    parts.forEach(function(part){
      if(part.type==="year"||part.type==="month"||part.type==="day"){
        date[part.type]=Number(part.value);
      }
    });
    date.iso=date.year+"-"+pad(date.month)+"-"+pad(date.day);
    return date;
  }
  function valid(record){
    return record&&typeof record.displayName==="string"&&record.displayName.trim()!==""&&
      Number(record.month)>=1&&Number(record.month)<=12&&
      Number(record.day)>=1&&Number(record.day)<=31;
  }
  function clean(list){
    if(!Array.isArray(list)){return fallback.slice()}
    return list.filter(valid).map(function(record){
      return {
        displayName:record.displayName.trim(),
        month:Number(record.month),
        day:Number(record.day)
      };
    });
  }
  function namesFor(date){
    return records.filter(function(record){
      return record.month===date.month&&record.day===date.day;
    });
  }
  function formatNames(list){
    var names=list.map(function(record){return record.displayName});
    if(names.length===1){return names[0]}
    if(names.length===2){return names[0]+" & "+names[1]}
    return names.slice(0,-1).join(", ")+" & "+names[names.length-1];
  }
  function getStorage(key){
    try{return sessionStorage.getItem(key)}catch(error){return null}
  }
  function setStorage(key,value){
    try{sessionStorage.setItem(key,value)}catch(error){}
  }
  function piece(container,pageMode){
    var item=document.createElement("i");
    var size=(pageMode?5:3)+Math.random()*(pageMode?7:5);
    var drift=(pageMode?-95:-18)+Math.random()*(pageMode?190:36);
    item.style.setProperty("--x",Math.random()*100+"%");
    item.style.setProperty("--size",size+"px");
    item.style.setProperty("--color",colors[Math.floor(Math.random()*colors.length)]);
    item.style.setProperty("--rotate",Math.random()*360+"deg");
    item.style.setProperty("--duration",(pageMode?7:2.8)+Math.random()*(pageMode?8:3.2)+"s");
    item.style.setProperty("--delay",-Math.random()*(pageMode?14:5)+"s");
    item.style.setProperty("--drift",drift+"px");
    item.style.setProperty("--opacity",(.48+Math.random()*.42).toFixed(2));
    container.appendChild(item);
  }
  function buildHeaderPieces(){
    if(headerPieces.children.length){return}
    for(var index=0;index<26;index++){piece(headerPieces,false)}
  }
  function removePagePieces(){
    var layer=document.getElementById(PAGE_ID);
    if(layer){layer.remove()}
  }
  function buildPagePieces(){
    removePagePieces();
    var layer=document.createElement("div");
    layer.id=PAGE_ID;
    layer.setAttribute("aria-hidden","true");
    document.body.appendChild(layer);
    var amount=window.innerWidth<=600?34:58;
    for(var index=0;index<amount;index++){piece(layer,true)}
  }
  function syncSlot(){
    var slot=banner.closest(".hc-banner-slide");
    if(slot){
      slot.hidden=Boolean(banner.hidden);
      slot.setAttribute("aria-hidden",banner.hidden?"true":"false");
    }
  }
  function setHidden(hidden){
    banner.hidden=hidden;
    syncSlot();
    window.setTimeout(syncSlot,0);
  }
  function update(){
    var date=dateNow();
    var birthdays=namesFor(date);
    if(!birthdays.length){
      setHidden(true);
      document.body.classList.remove("hc-birthday-active");
      removePagePieces();
      return;
    }

    var names=formatNames(birthdays);
    var key="hc-birthday-header-dismissed-"+date.iso;
    title.textContent="Happy Birthday, "+names+"! 🎉";
    dateLabel.textContent=MONTHS[date.month-1]+" "+date.day+" • Harley’s Clan Birthday Celebration";
    banner.setAttribute("aria-label","Birthday celebration for "+names);
    document.body.classList.add("hc-birthday-active");
    buildHeaderPieces();

    var dismissed=getStorage(key)==="yes";
    setHidden(dismissed);
    if(dismissed){removePagePieces()}else{buildPagePieces()}
  }
  function load(){
    if(typeof fetch!=="function"){update();return}
    fetch(RECORDS_URL,{cache:"no-store"})
      .then(function(response){
        if(!response.ok){throw new Error("Birthday records unavailable")}
        return response.json();
      })
      .then(function(data){records=clean(data&&data.records);update()})
      .catch(function(){records=fallback.slice();update()});
  }

  close.addEventListener("click",function(){
    var date=dateNow();
    setStorage("hc-birthday-header-dismissed-"+date.iso,"yes");
    setHidden(true);
    removePagePieces();
  });

  new MutationObserver(syncSlot).observe(banner,{
    attributes:true,
    attributeFilter:["hidden"]
  });

  update();
  load();
  window.setInterval(update,CHECK_INTERVAL);
})();
</script>

<script src="https://cdn.jsdelivr.net/gh/markhitchk/hcf@11e1bc7855fcf948095039453db18c22f1ddafb2/addons/celebrations/holidays.js"></script>

<script>
(function(){
  "use strict";

  var stack=document.getElementById("hc-header-stack");
  if(!stack){return}

  var ROTATE_EVERY=12000;
  var TRANSITION_TIME=750;
  var timer=null;
  var currentSlide=null;
  var transitioning=false;
  var paused=false;
  var syncQueued=false;
  var selector="#forum-notice,#hc-birthday-header,#hc-holiday-header,[data-hc-banner]";
  var reduceMotion=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function bannerFor(slide){return slide&&slide.querySelector(selector)}
  function visible(item){return !!item&&!item.hidden&&window.getComputedStyle(item).display!=="none"}
  function wrap(){
    Array.prototype.slice.call(stack.children).forEach(function(child){
      if(child.classList&&child.classList.contains("hc-banner-slide")){return}
      if(!child.matches||!child.matches(selector)){return}
      var wrapper=document.createElement("div");
      wrapper.className="hc-banner-slide";
      wrapper.setAttribute("data-hc-banner-slide","");
      stack.insertBefore(wrapper,child);
      wrapper.appendChild(child);
    });
  }
  function allSlides(){return Array.prototype.slice.call(stack.querySelectorAll(":scope > .hc-banner-slide"))}
  function visibleSlides(){
    return allSlides().filter(function(slide){
      var item=bannerFor(slide);
      slide.hidden=!visible(item);
      return visible(item);
    });
  }
  function clear(slide){
    slide.classList.remove("is-active","is-leaving","is-entering","is-entering-active");
    slide.removeAttribute("aria-hidden");
  }
  function single(slides){
    window.clearInterval(timer);
    timer=null;
    transitioning=false;
    stack.classList.remove("hc-banner-rotator");
    allSlides().forEach(clear);
    currentSlide=slides.length?slides[0]:null;
  }
  function activate(slide,slides){
    slides.forEach(function(item){
      clear(item);
      if(item!==slide){item.setAttribute("aria-hidden","true")}
    });
    slide.classList.add("is-active");
    slide.removeAttribute("aria-hidden");
    currentSlide=slide;
    stack.classList.add("hc-banner-rotator");
  }
  function restart(){
    window.clearInterval(timer);
    timer=null;
    if(paused||visibleSlides().length<2){return}
    timer=window.setInterval(next,ROTATE_EVERY);
  }
  function next(){
    if(paused||transitioning){return}
    var slides=visibleSlides();
    if(slides.length<2){sync();return}

    var currentIndex=slides.indexOf(currentSlide);
    if(currentIndex<0){activate(slides[0],slides);restart();return}

    var following=slides[(currentIndex+1)%slides.length];
    if(following===currentSlide){return}
    if(reduceMotion){activate(following,slides);return}

    transitioning=true;
    var current=currentSlide;
    following.classList.add("is-entering");
    following.removeAttribute("aria-hidden");
    void following.offsetWidth;
    current.classList.add("is-leaving");
    following.classList.add("is-entering-active");

    window.setTimeout(function(){
      clear(current);
      current.setAttribute("aria-hidden","true");
      clear(following);
      following.classList.add("is-active");
      following.removeAttribute("aria-hidden");
      currentSlide=following;
      transitioning=false;
    },TRANSITION_TIME+60);
  }
  function sync(){
    wrap();
    var slides=visibleSlides();
    if(slides.length<2){single(slides);return}
    stack.classList.add("hc-banner-rotator");
    if(!currentSlide||slides.indexOf(currentSlide)===-1){activate(slides[0],slides)}
    restart();
  }
  function queueSync(){
    if(syncQueued){return}
    syncQueued=true;
    window.setTimeout(function(){syncQueued=false;sync()},0);
  }

  stack.addEventListener("mouseenter",function(){paused=true;window.clearInterval(timer);timer=null});
  stack.addEventListener("mouseleave",function(){paused=false;restart()});
  stack.addEventListener("focusin",function(){paused=true;window.clearInterval(timer);timer=null});
  stack.addEventListener("focusout",function(event){
    if(stack.contains(event.relatedTarget)){return}
    paused=false;
    restart();
  });
  document.addEventListener("visibilitychange",function(){
    paused=document.hidden;
    if(paused){window.clearInterval(timer);timer=null}else{restart()}
  });

  new MutationObserver(queueSync).observe(stack,{
    childList:true,
    subtree:true,
    attributes:true,
    attributeFilter:["hidden"]
  });

  sync();
})();
</script>
