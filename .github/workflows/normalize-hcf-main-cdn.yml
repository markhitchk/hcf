name: Normalize HCF main CDN refs

on:
  push:
    paths:
      - .github/workflows/normalize-hcf-main-cdn.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace non-main HCF jsDelivr refs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          extensions = {'.css', '.js', '.html'}
          pattern = re.compile(r'https://cdn\.jsdelivr\.net/gh/markhitchk/hcf@([^/\s\"\'\)]+)/')
          changed = []

          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in extensions:
                  continue
              text = path.read_text(encoding='utf-8')
              original = text

              def normalize(match):
                  return match.group(0) if match.group(1) == 'main' else 'https://cdn.jsdelivr.net/gh/markhitchk/hcf@main/'

              text = pattern.sub(normalize, text)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(path.as_posix())

          print('Updated:')
          for path in changed:
              print(f' - {path}')
          PY

      - name: Verify runtime refs use main
        shell: bash
        run: node scripts/validate-global-assets.mjs

      - name: Commit normalized refs
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'normalize HCF CDN refs to main'
          git push origin HEAD:main
