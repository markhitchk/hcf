name: HCF guarded maintenance patch v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hcf-maintenance-patch-v2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract and run corrected guarded patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/hcf-maintenance-patch.yml').read_text(encoding='utf-8')
          start = source.index('          from pathlib import Path\n')
          end = source.index('          PY\n', start)
          block = source[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines()) + '\n'
          script = script.replace(r"r'hcf-page\\.js\\?v=", r"r'hcf-page\.js\?v=")
          Path('/tmp/hcf-maintenance-patch.py').write_text(script, encoding='utf-8')
          PY

          set +e
          python3 /tmp/hcf-maintenance-patch.py >/tmp/hcf-patch-output.txt 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            git clean -fd
            cp /tmp/hcf-patch-output.txt hcf-patch-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add hcf-patch-error.txt
            git commit -m "Record HCF maintenance patch guard failure"
            git push origin HEAD:main
            exit "$status"
          fi

      - name: Run required validators
        run: |
          node scripts/validate.mjs
          node scripts/validate-global-assets.mjs
      - name: Commit maintenance fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finish HCF runtime and repo hygiene fixes"
          git push origin HEAD:main
