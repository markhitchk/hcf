name: Apply Final Optimization Review Fixes

on:
  push:
    branches:
      - perf/hcf-css-js-html-optimization

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-final-review-fixes.mjs
      - name: Commit review fixes
        shell: bash
        run: |
          if git diff --quiet -- v1.x/core/header.html v1.x/core/footer.html; then
            echo "Review fixes already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v1.x/core/header.html v1.x/core/footer.html
          git commit -m "fix: close HCF optimization review gaps"
          git push origin HEAD:${GITHUB_REF_NAME}
