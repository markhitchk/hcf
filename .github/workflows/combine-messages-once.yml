name: Combine messaging CSS once

on:
  push:
    paths:
      - '.github/workflows/combine-messages-once.yml'

permissions:
  contents: write

jobs:
  combine:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build one physical messages.css file
        shell: bash
        run: |
          set -euo pipefail

          temp_dir="$(mktemp -d)"
          git show 7931387a233793e65cfde707fb3eb2d9bde7f0eb:addons/conversations.css > "$temp_dir/conversations.css"
          git show 7931387a233793e65cfde707fb3eb2d9bde7f0eb:addons/notifications-messenger-style.css > "$temp_dir/notifications-messenger-style.css"

          {
            printf '%s\n' '/* ========================================================================== '
            printf '%s\n' "   Harley's Clan Forum — Combined Messaging CSS"
            printf '%s\n' '   File: addons/messages.css'
            printf '%s\n' '   Contains: messenger + conversations + notification/message overrides'
            printf '%s\n' '   This is a physical bundle: no messaging @imports are used below.'
            printf '%s\n\n' '   ========================================================================== */'

            printf '%s\n' '/* ==================== MESSENGER BASE ==================== */'
            cat addons/messenger.css
            printf '\n\n%s\n' '/* ==================== CONVERSATIONS PAGE ==================== */'
            cat "$temp_dir/conversations.css"
            printf '\n\n%s\n' '/* ==================== NOTIFICATIONS + FINAL MESSAGE FIXES ==================== */'
            cat "$temp_dir/notifications-messenger-style.css"
          } > addons/messages.css.new

          mv addons/messages.css.new addons/messages.css

          # The old split files are no longer needed. conversations.css and
          # notifications-messenger-style.css were already removed earlier.
          git rm addons/messenger.css

          # Remove this one-shot workflow from the final repository state.
          git rm .github/workflows/combine-messages-once.yml

          git config user.name 'HarleyTG CSS Combiner'
          git config user.email 'actions@users.noreply.github.com'
          git add addons/messages.css
          git commit -m 'Combine all messaging CSS into messages.css'
          git push
