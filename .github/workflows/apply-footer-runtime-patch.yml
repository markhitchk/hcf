name: Apply Footer Runtime Patch

on:
  push:
    branches:
      - perf/hcf-css-js-html-optimization

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-footer-runtime-patch.mjs
      - name: Commit footer patch
        shell: bash
        run: |
          if git diff --quiet -- v1.x/core/footer.html; then
            echo "Footer already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v1.x/core/footer.html
          git commit -m "perf: make footer identity refresh event-driven"
          git push origin HEAD:${GITHUB_REF_NAME}
