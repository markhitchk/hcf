name: Apply Optimization Release Metadata

on:
  push:
    branches:
      - perf/hcf-css-js-html-optimization

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-optimization-release-metadata.mjs
      - name: Commit release metadata
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Release metadata already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v1.x README.md docs/superpowers/specs/2026-09-16-hcf-css-js-html-optimization-design.md
          git commit -m "chore: finalize HCF performance optimization release"
          git push origin HEAD:${GITHUB_REF_NAME}
