name: Build HCF Android Official

on:
  workflow_dispatch:
  push:
    branches:
      - agent/hcf-android-apk
    paths:
      - "android-app/**"
      - ".github/workflows/build-hcf-android-official.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 17 preview SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" || sdkmanager --channel=3 "platforms;android-37" "build-tools;37.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Locate and verify APK
        run: |
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"
          BT="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BT/zipalign" -c -v 4 "$APK"
          "$BT/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HarleysClanForum-Android14-official
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
