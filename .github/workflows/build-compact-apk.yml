name: Build Harley's Clan Forum APK 0.3.0

on:
  push:
    branches:
      - chatgpt-apk-0.3.0-instant-notifications
    paths:
      - '.apkbuild/**'
      - '.github/workflows/build-compact-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore v0.2.9 source and apply v0.3.0 override
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.apkbuild/source.b64.part-003')
          s = p.read_text()
          replacement = ''
          if len(replacement) != 500:
              raise SystemExit('repair chunk length mismatch')
          s = s[:9000] + replacement + s[9500:]
          p.write_text(s)
          PY

          mkdir -p build-input/source
          cat .apkbuild/source.b64.part-* | base64 -d > build-input/source.tar.xz
          xz -t build-input/source.tar.xz
          tar -xJf build-input/source.tar.xz -C build-input/source

          cat .apkbuild/v030-override.b64.part-* | base64 -d > build-input/v030-override.tar.xz
          xz -t build-input/v030-override.tar.xz
          tar -xJf build-input/v030-override.tar.xz -C build-input/source

          mkdir -p app/src/main/java app/src/main/res app/src/main/assets
          cp -R build-input/source/src/com app/src/main/java/
          cp -R build-input/source/res/. app/src/main/res/
          cp -R build-input/source/assets/. app/src/main/assets/
          cp build-input/source/AndroidManifest.xml app/src/main/AndroidManifest.xml

          mkdir -p app/src/main/res/drawable-nodpi
          curl -fsSL \
            https://raw.githubusercontent.com/markhitchk/hcf/main/assets/logos/HTG-App-Icon.png \
            -o app/src/main/res/drawable-nodpi/htg_app_logo.png

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'HarleysClanForum'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.harleytg.forum'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.harleytg.forum'
                  minSdk 26
                  targetSdk 34
                  versionCode 3009999
                  versionName '0.3.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

          grep -R "VERSION = \"0.3.0\"" app/src/main/java/com/harleytg/forum/BuildInfo.java
          grep -R "android:versionName=\"0.3.0\"" app/src/main/AndroidManifest.xml

      - name: Ensure Android 34 SDK
        shell: bash
        run: |
          set -euo pipefail
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager "platforms;android-34" "build-tools;34.0.0" || true
          fi

      - name: Build installable APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Validate and publish built APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          mkdir -p output
          cp "$APK" output/HarleysClanForum-0.3.0.apk
          sha256sum output/HarleysClanForum-0.3.0.apk | tee output/HarleysClanForum-0.3.0.apk.sha256
          git config user.name "chatgpt-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/HarleysClanForum-0.3.0.apk output/HarleysClanForum-0.3.0.apk.sha256
          if ! git diff --cached --quiet; then
            git commit -m "Build 0.3.0 test APK"
            git push
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HarleysClanForum-0.3.0
          path: |
            output/HarleysClanForum-0.3.0.apk
            output/HarleysClanForum-0.3.0.apk.sha256
          if-no-files-found: error
          retention-days: 1
