name: Build compact header APK

on:
  push:
    branches:
      - chatgpt-apk-compact-header-028
    paths:
      - '.apkbuild/**'
      - '.github/workflows/build-compact-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore Android source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.apkbuild/source.b64.part-003')
          s = p.read_text()
          replacement = ''
          if len(replacement) != 500:
              raise SystemExit('repair chunk length mismatch')
          s = s[:9000] + replacement + s[9500:]
          p.write_text(s)
          PY

          mkdir -p build-input
          cat .apkbuild/source.b64.part-* | base64 -d > build-input/source.tar.xz
          xz -t build-input/source.tar.xz
          mkdir -p build-input/source
          tar -xJf build-input/source.tar.xz -C build-input/source

          mkdir -p app/src/main/java app/src/main/res app/src/main/assets
          cp -R build-input/source/src/com app/src/main/java/
          cp -R build-input/source/res/. app/src/main/res/
          cp -R build-input/source/assets/. app/src/main/assets/
          cp build-input/source/AndroidManifest.xml app/src/main/AndroidManifest.xml

          mkdir -p app/src/main/res/drawable-nodpi
          curl -fsSL \
            https://raw.githubusercontent.com/markhitchk/hcf/main/assets/logos/HTG-App-Icon.png \
            -o app/src/main/res/drawable-nodpi/htg_app_logo.png

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'HarleysClanForum'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.harleytg.forum'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.harleytg.forum'
                  minSdk 26
                  targetSdk 34
                  versionCode 2089999
                  versionName '0.2.8'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

      - name: Ensure Android 34 SDK
        shell: bash
        run: |
          set -euo pipefail
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager "platforms;android-34" "build-tools;34.0.0" || true
          fi

      - name: Build installable APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Publish built APK on this temporary branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/HarleysClanForum-0.2.8-compact-header.apk
          git config user.name "chatgpt-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/HarleysClanForum-0.2.8-compact-header.apk
          git commit -m "Build compact header APK"
          git push
