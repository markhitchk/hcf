name: Validate HCF

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate HCF 1.x and shared files
        run: node scripts/validate.mjs
      - name: Validate complete HCF Flarum 2.x parity
        run: node scripts/validate-v2.mjs
