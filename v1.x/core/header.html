<!-- Paste this body-only fragment into Flarum's custom header field. -->
<style>
:root{
  --hc-banner-height:58px;
  --hc-yellow:#ffd400;
  --hc-dark:#090a0c;
}

#hc-header-stack,
#hc-header-stack *,
#hc-header-stack *::before,
#hc-header-stack *::after,
#hc-birthday-effects,
#hc-birthday-effects *{box-sizing:border-box}

#hc-header-stack{
  position:relative;
  z-index:901;
  isolation:isolate;
  width:100%;
  height:var(--hc-banner-height);
  min-height:var(--hc-banner-height);
  max-height:var(--hc-banner-height);
  margin:0;
  padding:0;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
}

#hc-header-stack .hc-slide{
  width:100%;
  height:var(--hc-banner-height);
  min-height:var(--hc-banner-height);
  max-height:var(--hc-banner-height);
  margin:0;
  padding:0;
  overflow:hidden;
}

#hc-header-stack .hc-slide[hidden],
#hc-header-stack [hidden]{display:none!important}

#hc-header-stack.hc-rotating .hc-slide{
  position:absolute;
  inset:0;
  z-index:0;
  width:100%;
  opacity:0;
  pointer-events:none;
  transform:translate3d(100%,0,0);
  transition:
    transform .9s cubic-bezier(.16,1,.3,1),
    opacity .72s ease;
  will-change:transform,opacity;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
}

#hc-header-stack.hc-rotating .hc-slide.is-active{
  z-index:2;
  opacity:1;
  pointer-events:auto;
  transform:translate3d(0,0,0);
}

#hc-header-stack.hc-rotating .hc-slide.is-leaving{
  z-index:1;
  opacity:0;
  pointer-events:none;
  transform:translate3d(-100%,0,0);
}

#hc-header-stack.hc-rotating .hc-slide.is-entering{
  z-index:3;
  opacity:0;
  transform:translate3d(100%,0,0);
}

#hc-header-stack.hc-rotating .hc-slide.is-entering.is-entering-active{
  opacity:1;
  pointer-events:auto;
  transform:translate3d(0,0,0);
}

#forum-notice{
  position:relative;
  isolation:isolate;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  width:100%;
  height:var(--hc-banner-height);
  margin:0;
  padding:6px 44px 7px;
  overflow:hidden;
  border-top:1px solid var(--hc-yellow);
  border-bottom:1px solid var(--hc-yellow);
  background:linear-gradient(180deg,rgba(255,212,0,.04),transparent 48%),var(--hc-dark);
  color:var(--hc-yellow);
  text-align:center;
  box-shadow:0 0 16px rgba(255,212,0,.08),inset 0 1px rgba(255,255,255,.035);
  animation:hcNoticePulse 3.4s ease-in-out infinite;
}

#forum-notice::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  pointer-events:none;
  opacity:.22;
  background:repeating-linear-gradient(-45deg,transparent 0 10px,rgba(255,212,0,.5) 10px 20px);
  background-size:28px 28px;
  animation:hcNoticeStripes 2.8s linear infinite;
}

.hc-notice-title{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  font-size:13px;
  font-weight:800;
  line-height:1.2;
  letter-spacing:2px;
  text-transform:uppercase;
  text-shadow:0 0 5px rgba(255,212,0,.72);
}

.hc-notice-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--hc-yellow);
  box-shadow:0 0 5px var(--hc-yellow),0 0 12px rgba(255,212,0,.72);
  animation:hcNoticeDot 1.65s ease-in-out infinite;
}

.hc-notice-message{
  margin-top:3px;
  color:#fff7c2;
  font-size:11px;
  line-height:1.35;
}

.hc-notice-message a{
  margin-left:.35em;
  color:var(--hc-yellow);
  font-weight:800;
  text-decoration:none;
}

.hc-notice-message strong{color:#fff2a4}

#hc-birthday-header{
  position:relative;
  isolation:isolate;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  width:100%;
  height:var(--hc-banner-height);
  margin:0;
  padding:8px 48px 8px 16px;
  overflow:hidden;
  border-top:1px solid rgba(255,255,255,.72);
  border-bottom:1px solid rgba(255,255,255,.72);
  background:linear-gradient(115deg,#00cfd8,#4f8cff,#b86cff,#ff5fc8);
  color:#fff;
  text-align:center;
  box-shadow:0 7px 22px rgba(0,0,0,.32),0 0 24px rgba(0,255,255,.3),inset 0 1px rgba(255,255,255,.18);
  animation:hcBirthdayGlow 3s ease-in-out infinite;
}

#hc-birthday-header::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-2;
  pointer-events:none;
  background:
    radial-gradient(circle at 15% 40%,rgba(255,255,255,.2),transparent 22%),
    radial-gradient(circle at 82% 50%,rgba(255,215,106,.18),transparent 26%);
}

#hc-birthday-header::after{
  content:"";
  position:absolute;
  top:-45%;
  left:-40%;
  z-index:-1;
  width:34%;
  height:190%;
  pointer-events:none;
  opacity:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),rgba(255,255,255,.42),rgba(255,255,255,.08),transparent);
  transform:skewX(-18deg);
  animation:hcBirthdaySweep 4.8s ease-in-out infinite;
}

.hc-birthday-icon{
  position:relative;
  z-index:3;
  flex:0 0 auto;
  font-size:27px;
  line-height:1;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.3));
  animation:hcBirthdayIcon 1.55s ease-in-out infinite;
}

.hc-birthday-copy{position:relative;z-index:3;min-width:0}

.hc-birthday-copy strong{
  display:block;
  color:#fff;
  font-size:15px;
  font-weight:900;
  line-height:1.2;
  letter-spacing:.055em;
  text-shadow:0 1px 2px rgba(0,0,0,.55),0 0 9px rgba(255,255,255,.3);
}

.hc-birthday-copy small{
  display:block;
  margin-top:3px;
  color:rgba(255,255,255,.94);
  font:700 9px/1.35 "Courier New",monospace;
  letter-spacing:.12em;
  text-transform:uppercase;
  text-shadow:0 1px 2px rgba(0,0,0,.42);
}

#hc-birthday-close{
  position:absolute;
  top:50%;
  right:10px;
  z-index:12;
  display:grid;
  place-items:center;
  width:32px;
  height:32px;
  padding:0;
  border:1px solid rgba(255,255,255,.46);
  border-radius:50%;
  background:rgba(0,0,0,.22);
  color:#fff;
  cursor:pointer;
  font:700 20px/1 Arial,sans-serif;
  transform:translateY(-50%);
}

#hc-birthday-header-particles{
  position:absolute;
  inset:0;
  z-index:10;
  overflow:hidden;
  pointer-events:none;
}

#hc-birthday-header-particles i,
#hc-birthday-effects i{
  position:absolute;
  top:-30px;
  left:var(--x);
  display:block;
  width:var(--s);
  height:calc(var(--s) * 1.7);
  border-radius:2px;
  background:var(--c);
  opacity:var(--o);
  animation:hcBirthdayFall var(--d) linear infinite;
  animation-delay:var(--delay);
}

#hc-birthday-effects{
  position:fixed;
  inset:0;
  z-index:800;
  overflow:hidden;
  pointer-events:none;
  contain:strict;
}

html body #hc-holiday-header{
  height:var(--hc-banner-height)!important;
  min-height:var(--hc-banner-height)!important;
  max-height:var(--hc-banner-height)!important;
  animation:hcHolidayGlow 3s ease-in-out infinite!important;
}

@keyframes hcNoticePulse{
  50%{box-shadow:0 0 20px rgba(255,212,0,.16),inset 0 1px rgba(255,255,255,.055)}
}
@keyframes hcNoticeStripes{to{background-position:28px 28px}}
@keyframes hcNoticeDot{
  0%,100%{opacity:.35;transform:scale(.72)}
  50%{opacity:1;transform:scale(1.25)}
}
@keyframes hcBirthdayGlow{
  50%{box-shadow:0 8px 25px rgba(0,0,0,.35),0 0 30px rgba(0,255,255,.42),0 0 40px rgba(255,95,200,.24),inset 0 1px rgba(255,255,255,.24)}
}
@keyframes hcBirthdaySweep{
  0%,12%{left:-40%;opacity:0}
  20%{opacity:.95}
  68%{opacity:.55}
  80%,100%{left:115%;opacity:0}
}
@keyframes hcBirthdayIcon{
  0%,100%{transform:translateY(1px) rotate(-5deg) scale(.97)}
  50%{transform:translateY(-3px) rotate(5deg) scale(1.06)}
}
@keyframes hcBirthdayFall{
  from{transform:translate3d(0,-8vh,0) rotate(0)}
  to{transform:translate3d(var(--drift),112vh,0) rotate(780deg)}
}

@media(max-width:600px){
  :root{--hc-banner-height:64px}
  #forum-notice{padding:7px 10px 8px}
  .hc-notice-title{gap:5px;font-size:11px;letter-spacing:1.25px}
  .hc-notice-message{font-size:10px;line-height:1.45}
  #hc-birthday-header{gap:8px;padding:7px 40px 7px 9px}
  .hc-birthday-icon{font-size:22px}
  .hc-birthday-copy strong{font-size:12px;letter-spacing:.025em}
  .hc-birthday-copy small{font-size:8px;letter-spacing:.07em}
  #hc-birthday-close{right:6px;width:29px;height:29px;font-size:17px}
}

@media(prefers-reduced-motion:reduce){
  #hc-header-stack.hc-rotating .hc-slide{transition:none!important}
  #forum-notice,
  #forum-notice::before,
  .hc-notice-dot,
  #hc-birthday-header,
  #hc-birthday-header::after,
  .hc-birthday-icon,
  #hc-birthday-header-particles i,
  #hc-birthday-effects i{animation:none!important}
  #hc-birthday-effects{display:none!important}
}

<script>
(function domainExpirationNotice(){
  "use strict";

  var item=document.getElementById("hc-domain-expiration");
  var cutoff=new Date("2026-10-13T00:00:00-07:00").getTime();
  var MAX_TIMEOUT=2147483647;

  function sync(){
    if(!item){return}
    var remaining=cutoff-Date.now();

    if(remaining<=0){
      item.remove();
      item=null;
      try{document.dispatchEvent(new CustomEvent("hc-banners-changed"))}catch(error){}
      return;
    }

    window.setTimeout(sync,Math.min(remaining,MAX_TIMEOUT));
  }

  sync();
})();
</script>

<script>
(function birthdaySystem(){
  "use strict";

  var RECORDS_URL="https://cdn.jsdelivr.net/gh/markhitchk/hcf@main/v1.x/add-ons/seasonal/birthdays.json";
  var TIME_ZONE="America/Los_Angeles";
  var MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
  var fallback=[
    {displayName:"Comander Forrest",month:1,day:28},
    {displayName:"Woodyseal1213",month:2,day:4},
    {displayName:"Zack (Big King Sexy)",month:3,day:19},
    {displayName:"Darsoul",month:4,day:7},
    {displayName:"Levi-jeans",month:6,day:7},
    {displayName:"HarleyTG",month:8,day:4},
    {displayName:"Gh0st",month:9,day:1},
    {displayName:"R3V0L",month:11,day:11},
    {displayName:"SMOKES1722",month:11,day:28},
    {displayName:"KING OF HEARTS",month:12,day:8},
    {displayName:"xeqtmツ",month:12,day:28}
  ];

  var records=fallback.slice();
  var dismissedThisPage=false;
  var activeToday=false;
  var slide=document.querySelector('[data-hc-slide="birthday"]');
  var banner=document.getElementById("hc-birthday-header");
  var title=document.getElementById("hc-birthday-title");
  var dateLabel=document.getElementById("hc-birthday-date");
  var close=document.getElementById("hc-birthday-close");
  var headerParticles=document.getElementById("hc-birthday-header-particles");
  var colors=["#00ffff","#5ea1ff","#b86cff","#ff5fc8","#ffd76a","#ffffff"];

  function dateNow(){
    var parts=new Intl.DateTimeFormat("en-US",{
      timeZone:TIME_ZONE,
      year:"numeric",
      month:"numeric",
      day:"numeric"
    }).formatToParts(new Date());
    var date={year:0,month:0,day:0};
    parts.forEach(function(part){
      if(part.type==="year"||part.type==="month"||part.type==="day"){
        date[part.type]=Number(part.value);
      }
    });
    return date;
  }

  function clean(list){
    if(!Array.isArray(list)){return fallback.slice()}
    return list.filter(function(item){
      return item&&typeof item.displayName==="string"&&item.displayName.trim()&&
        Number(item.month)>=1&&Number(item.month)<=12&&
        Number(item.day)>=1&&Number(item.day)<=31;
    }).map(function(item){
      return {displayName:item.displayName.trim(),month:Number(item.month),day:Number(item.day)};
    });
  }

  function matching(date){
    return records.filter(function(item){
      return item.month===date.month&&item.day===date.day;
    });
  }

  function namesText(list){
    var names=list.map(function(item){return item.displayName});
    if(names.length===1){return names[0]}
    if(names.length===2){return names[0]+" & "+names[1]}
    return names.slice(0,-1).join(", ")+" & "+names[names.length-1];
  }

  function makePiece(container,page){
    var item=document.createElement("i");
    item.style.setProperty("--x",Math.random()*100+"%");
    item.style.setProperty("--s",((page?5:3)+Math.random()*(page?7:5))+"px");
    item.style.setProperty("--c",colors[Math.floor(Math.random()*colors.length)]);
    item.style.setProperty("--d",((page?7:2.8)+Math.random()*(page?8:3.2))+"s");
    item.style.setProperty("--delay",(-Math.random()*(page?14:5))+"s");
    item.style.setProperty("--drift",((page?-95:-18)+Math.random()*(page?190:36))+"px");
    item.style.setProperty("--o",(.48+Math.random()*.42).toFixed(2));
    container.appendChild(item);
  }

  function buildHeaderParticles(){
    if(headerParticles.children.length){return}
    for(var i=0;i<26;i++){makePiece(headerParticles,false)}
  }

  function showHeaderParticles(){
    buildHeaderParticles();
    headerParticles.hidden=false;
  }

  function hideHeaderParticles(){headerParticles.hidden=true}

  function removePageEffects(){
    var layer=document.getElementById("hc-birthday-effects");
    if(layer){layer.remove()}
  }

  function buildPageEffects(){
    if(document.getElementById("hc-birthday-effects")){return}
    var layer=document.createElement("div");
    layer.id="hc-birthday-effects";
    layer.setAttribute("aria-hidden","true");
    document.body.appendChild(layer);
    var total=window.innerWidth<=600?34:58;
    for(var i=0;i<total;i++){makePiece(layer,true)}
  }

  function notify(){
    try{document.dispatchEvent(new CustomEvent("hc-banners-changed"))}catch(error){}
  }

  function showToday(){
    var date=dateNow();
    var birthdays=matching(date);
    activeToday=birthdays.length>0&&!dismissedThisPage;

    if(!activeToday){
      slide.hidden=true;
      banner.hidden=true;
      hideHeaderParticles();
      removePageEffects();
      notify();
      return false;
    }

    var names=namesText(birthdays);
    title.textContent="Happy Birthday, "+names+"! 🎉";
    dateLabel.textContent=MONTHS[date.month-1]+" "+date.day+" • Harley’s Clan Birthday Celebration";
    banner.setAttribute("aria-label","Birthday celebration for "+names);
    banner.hidden=false;
    slide.hidden=false;
    showHeaderParticles();
    buildPageEffects();
    notify();
    return true;
  }

  close.addEventListener("click",function(){
    dismissedThisPage=true;
    activeToday=false;
    slide.hidden=true;
    banner.hidden=true;
    hideHeaderParticles();
    removePageEffects();
    notify();
  });

  window.HCBirthday={
    refresh:showToday,
    isActive:function(){return activeToday},
    showEffects:function(){
      if(activeToday){showHeaderParticles();buildPageEffects()}
    },
    hideEffects:function(){
      if(!activeToday){hideHeaderParticles();removePageEffects()}
    }
  };

  showToday();

  if(typeof fetch==="function"){
    fetch(RECORDS_URL,{cache:"no-store"})
      .then(function(response){
        if(!response.ok){throw new Error("Birthday records unavailable")}
        return response.json();
      })
      .then(function(data){records=clean(data&&data.records);showToday()})
      .catch(function(){records=fallback.slice();showToday()});
  }

  window.setInterval(showToday,30000);
})();
</script>

<script>
(function bannerRotator(){
  "use strict";

  var stack=document.getElementById("hc-header-stack");
  var ROTATE_EVERY=6000;
  var TRANSITION=900;
  var timer=null;
  var current=null;
  var transitioning=false;
  var queued=false;

  function bannerFor(slide){
    return slide&&slide.querySelector("#forum-notice,#hc-birthday-header,#hc-holiday-header,[data-hc-banner]");
  }

  function isVisible(slide){
    var banner=bannerFor(slide);
    return !!slide&&!slide.hidden&&!!banner&&!banner.hidden&&window.getComputedStyle(banner).display!=="none";
  }

  function wrapDynamicBanners(){
    Array.prototype.slice.call(stack.children).forEach(function(child){
      if(child.classList&&child.classList.contains("hc-slide")){return}
      if(child.id==="hc-birthday-header-particles"){return}
      if(!child.matches||!child.matches("#hc-holiday-header,[data-hc-banner]")){return}
      var wrapper=document.createElement("div");
      wrapper.className="hc-slide";
      wrapper.setAttribute("data-hc-slide","dynamic");
      stack.insertBefore(wrapper,child);
      wrapper.appendChild(child);
    });
  }

  function slides(){
    wrapDynamicBanners();
    return Array.prototype.slice.call(stack.children).filter(function(child){
      return child.classList&&child.classList.contains("hc-slide");
    });
  }

  function visibleSlides(){return slides().filter(isVisible)}

  function clear(slide){
    if(!slide){return}
    slide.classList.remove("is-active","is-leaving","is-entering","is-entering-active");
    slide.removeAttribute("aria-hidden");
  }

  function preferredFirst(list){
    var birthday=list.filter(function(slide){
      return slide.getAttribute("data-hc-slide")==="birthday";
    })[0];
    return birthday||list[0]||null;
  }

  function updateEffects(){
    var banner=bannerFor(current);
    var holidayActive=banner&&banner.id==="hc-holiday-header";

    if(window.HCBirthday){
      if(typeof window.HCBirthday.isActive==="function"&&window.HCBirthday.isActive()){
        window.HCBirthday.showEffects();
      }else{
        window.HCBirthday.hideEffects();
      }
    }

    if(!holidayActive){
      var holidayLayer=document.getElementById("hc-holiday-effects");
      if(holidayLayer){holidayLayer.remove()}
    }else if(window.HCHolidays&&typeof window.HCHolidays.refresh==="function"){
      window.HCHolidays.refresh();
    }
  }

  function schedule(){
    window.clearTimeout(timer);
    timer=null;
    if(document.hidden||transitioning||visibleSlides().length<2){return}
    timer=window.setTimeout(next,ROTATE_EVERY);
  }

  function activate(slide,list){
    list.forEach(function(item){
      clear(item);
      if(item!==slide){item.setAttribute("aria-hidden","true")}
    });
    slide.classList.add("is-active");
    slide.removeAttribute("aria-hidden");
    current=slide;
    stack.classList.add("hc-rotating");
    updateEffects();
    schedule();
  }

  function showSingle(list){
    window.clearTimeout(timer);
    timer=null;
    transitioning=false;
    stack.classList.remove("hc-rotating");
    slides().forEach(clear);
    current=list[0]||null;
    if(current){current.classList.add("is-active")}
    updateEffects();
  }

  function next(){
    window.clearTimeout(timer);
    timer=null;
    var list=visibleSlides();

    if(list.length<2){sync();return}

    var index=list.indexOf(current);
    if(index<0){activate(preferredFirst(list),list);return}

    var incoming=list[(index+1)%list.length];
    if(!incoming||incoming===current){schedule();return}

    transitioning=true;
    var outgoing=current;
    incoming.classList.add("is-entering");
    incoming.removeAttribute("aria-hidden");
    void incoming.offsetWidth;
    outgoing.classList.add("is-leaving");
    incoming.classList.add("is-entering-active");

    window.setTimeout(function(){
      clear(outgoing);
      outgoing.setAttribute("aria-hidden","true");
      clear(incoming);
      incoming.classList.add("is-active");
      incoming.removeAttribute("aria-hidden");
      current=incoming;
      transitioning=false;
      updateEffects();
      schedule();
    },TRANSITION+80);
  }

  function sync(){
    var list=visibleSlides();
    if(list.length<2){showSingle(list);return}
    if(!current||list.indexOf(current)===-1){activate(preferredFirst(list),list);return}
    stack.classList.add("hc-rotating");
    updateEffects();
    schedule();
  }

  function queueSync(){
    if(queued){return}
    queued=true;
    window.setTimeout(function(){queued=false;sync()},0);
  }

  document.addEventListener("hc-banners-changed",queueSync);
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){window.clearTimeout(timer);timer=null}else{sync()}
  });

  new MutationObserver(queueSync).observe(stack,{
    childList:true,
    subtree:true,
    attributes:true,
    attributeFilter:["hidden"]
  });

  sync();
  window.setTimeout(sync,200);
  window.setTimeout(sync,800);
  window.setTimeout(sync,1600);
})();
</script>
