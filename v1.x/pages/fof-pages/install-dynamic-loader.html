<!-- =========================================================
     Harley's Clan Forum — FoF Pages Dynamic GitHub Loader
     AUTO-DISCOVERY BUILD 1.1.0

     Install ONCE in Flarum Admin > Appearance > Custom Footer.

     No page manifest is required.
     New FriendsOfFlarum pages are detected from their FoF page
     ID + slug automatically. The loader first checks the normal
     {page-id}-{page-slug}.html filename, then dynamically checks
     the GitHub fof-pages directory for an ID/slug match.

     If no GitHub HTML exists, the FoF database content remains
     visible as the safe fallback.
========================================================= -->
<script
  src="https://cdn.jsdelivr.net/gh/markhitchk/hcf@main/v1.x/pages/fof-pages/hcf-fof-loader.js?v=1.1.0"
  data-hcf-fof-loader="1.1.0"></script>
