<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d1014">

<title>Error | Harley's Clan Forum</title>

<link
  rel="icon"
  href="https://cdn.jsdelivr.net/gh/markhitchk/hcf@main/assets/logos/HTG.svg"
  type="image/svg+xml"
>

<style>
html,
body {
  min-height: 100%;
  margin: 0;
}

body {
  display: grid;
  place-items: center;
  padding: 20px;
  box-sizing: border-box;
  background: #0d1014;
  color: #eefcff;
  font-family: Arial, sans-serif;
}

.hcf-error-loader {
  max-width: 680px;
  text-align: center;
}

.hcf-error-loader h1 {
  margin: 0 0 12px;
  color: #00dfe6;
  font-size: clamp(32px, 8vw, 58px);
}

.hcf-error-loader p {
  margin: 0;
  color: #9cb7c2;
  line-height: 1.6;
}
</style>
</head>

<body>

<main class="hcf-error-loader" aria-live="polite" aria-busy="true">
  <h1>Harley's Clan Forum</h1>
  <p>Loading error handler…</p>
</main>

<script>
(function () {
  "use strict";

  var VALID_CODES = {
    403: true,
    404: true,
    500: true,
    503: true
  };

  function getFallbackCode() {
    var code = "500";

    try {
      var queryCode = new URLSearchParams(window.location.search).get("code");
      if (VALID_CODES[queryCode]) {
        return String(queryCode);
      }
    } catch (e) {}

    var match = window.location.pathname.match(/\/(403|404|500|503)\.html$/i);
    if (match && VALID_CODES[match[1]]) {
      code = match[1];
    }

    return code;
  }

  var fallbackCode = getFallbackCode();

  function startErrorLoader(code) {
    code = String(code);

    if (!VALID_CODES[code]) {
      code = fallbackCode;
    }

    document.documentElement.setAttribute("data-hcf-error", code);

    var script = document.createElement("script");
    script.src =
      "https://cdn.jsdelivr.net/gh/markhitchk/hcf@main/v1.x/pages/errors/error-loader.js?v=2.0.0";
    script.async = false;

    document.body.appendChild(script);
  }

  fetch(window.location.href, {
    method: "GET",
    cache: "no-store",
    credentials: "same-origin",
    redirect: "follow"
  })
  .then(function (response) {
    startErrorLoader(VALID_CODES[response.status] ? response.status : fallbackCode);
  })
  .catch(function () {
    startErrorLoader(503);
  });
})();
</script>

</body>
</html>
